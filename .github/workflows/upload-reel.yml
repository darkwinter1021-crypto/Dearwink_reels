name: Upload Dearwink Reel
on:
  workflow_dispatch:
    inputs:
      video_path:
        description: 'Repository path to the MP4/MOV file'
        required: true
        default: 'reels/science_fair.mp4'
jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.3
      - name: Upload to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: qjh0dnin
          CLOUDINARY_UPLOAD_PRESET: dearwink_reels
        run: python upload_cloudinary.py "${{ inputs.video_path }}"
